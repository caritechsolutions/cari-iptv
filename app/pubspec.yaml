name: cari_tv
description: "Mobile client for the CARI-IPTV platform (whitelabel-ready)."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^3.4.3

  # Networking + storage
  dio: ^5.11.1
  flutter_secure_storage: ^11.2.0
  hive_ce: ^2.20.0
  hive_ce_flutter: ^2.3.0
  connectivity_plus: ^7.3.1

  # Routing
  go_router: ^18.0.1

  # Media
  video_player: ^2.14.0
  wakelock_plus: ^1.8.0
  cached_network_image: ^4.0.0

  # Device / misc
  package_info_plus: ^10.2.1
  device_info_plus: ^13.2.0
  url_launcher: ^6.3.0
  intl: ^0.20.3
  clock: ^1.1.3
  shimmer: ^4.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.5
  http_mock_adapter: ^0.6.1
  # Platform-interface fakes for the player tests (already transitive deps).
  video_player_platform_interface: ^6.9.0
  wakelock_plus_platform_interface: ^1.7.0
  plugin_platform_interface: ^2.1.8
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true
  assets:
    - assets/branding/

# Launcher icons and splash are generated per brand by tool/apply_brand.dart
# (configs in tool/generated/, gitignored). See docs/WHITE_LABEL.md.
