name: Android debug APK

# build  → builds the caritv dev debug APK and the caritv prod release APK
# smoke  → boots an emulator (KVM), installs each APK, launches it, waits 20 s,
#          fails if the process died / FATAL EXCEPTION / activity not resumed;
#          logcat + screenshot are uploaded either way
# publish→ only after both smoke tests pass: prerelease dev-<short sha> with
#          the debug APK attached (+ workflow artifact fallback)
# Debug/test only: no secrets, no signing keys (release APK is debug-signed).

on:
  push:
    branches:
      - claude/intelligent-knuth-xzkkd7
    paths:
      - "app/**"
      - ".github/workflows/android-debug.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-debug-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.47.5"
  BRAND: caritv

jobs:
  build:
    name: Build APKs
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      short_sha: ${{ steps.meta.outputs.short_sha }}
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Flutter ${{ env.FLUTTER_VERSION }} (stable, pinned)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
          cache-key: "flutter-:os:-:channel:-:version:-:arch:"

      - name: Pub cache
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('app/pubspec.lock') }}
          restore-keys: |
            pub-${{ runner.os }}-

      - run: flutter pub get

      - name: Analyze and test
        run: |
          flutter analyze
          flutter test

      - name: Build dev debug APK
        run: ./tool/build_brand.sh "$BRAND" apk dev --debug

      - name: Build prod release APK (R8, debug-signed)
        run: ./tool/build_brand.sh "$BRAND" apk prod --no-icons

      - name: Collect
        id: meta
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"
          mkdir -p out
          cp build/app/outputs/flutter-apk/app-dev-debug.apk   "out/${BRAND}-dev-debug-${SHORT_SHA}.apk"
          cp build/app/outputs/flutter-apk/app-prod-release.apk "out/${BRAND}-prod-release-${SHORT_SHA}.apk"
          (cd out && sha256sum *.apk | tee SHA256SUMS.txt)

      - uses: actions/upload-artifact@v4
        with:
          name: apks-${{ steps.meta.outputs.short_sha }}
          path: app/out/
          retention-days: 14
          if-no-files-found: error

  smoke:
    name: Emulator smoke (${{ matrix.variant }})
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: dev-debug
            package: net.caritech.caritv.dev
          - variant: prod-release
            package: net.caritech.caritv
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: apks-${{ needs.build.outputs.short_sha }}
          path: apks

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: AVD cache
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-api34-x86_64-google_apis

      - name: Create AVD snapshot (cache miss only)
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "AVD created"

      - name: Run smoke test on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash app/tool/smoke_test.sh "apks/${{ env.BRAND }}-${{ matrix.variant }}-${{ needs.build.outputs.short_sha }}.apk" "${{ matrix.package }}" "smoke-${{ matrix.variant }}" 20

      - name: Upload logcat and screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-${{ matrix.variant }}-${{ needs.build.outputs.short_sha }}
          path: smoke-${{ matrix.variant }}/
          retention-days: 14
          if-no-files-found: warn

  publish:
    name: Publish prerelease
    needs: [build, smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: apks-${{ needs.build.outputs.short_sha }}
          path: apks

      - name: Publish prerelease dev-${{ needs.build.outputs.short_sha }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dev-${{ needs.build.outputs.short_sha }}
          target_commitish: ${{ github.sha }}
          name: "Debug build dev-${{ needs.build.outputs.short_sha }}"
          prerelease: true
          make_latest: false
          body: |
            Debug APK of the **${{ env.BRAND }}** brand, **dev** flavour (application id `net.caritech.caritv.dev`, label "CARI TV Dev").
            Built from `${{ github.sha }}` on branch `${{ github.ref_name }}`. Passed the emulator smoke test (debug and release variants launched and reached the foreground).

            Install: download the `.apk` below on the phone, open it and allow installing from this source. Signed with the debug key — not for stores.
          files: |
            apks/${{ env.BRAND }}-dev-debug-${{ needs.build.outputs.short_sha }}.apk
            apks/SHA256SUMS.txt
          token: ${{ secrets.GITHUB_TOKEN }}
