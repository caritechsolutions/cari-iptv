; VOD Server Configuration
; ========================
; Edit this file to configure the VOD server.
; Lines starting with ; or # are comments.
; Restart the service after changes: systemctl restart vod-server

[server]
; Port for the HTTP API and Web GUI
port = 8090

; Bind address (0.0.0.0 = all interfaces, 127.0.0.1 = localhost only)
bind_address = 0.0.0.0

; Master API key (used for initial setup, generate a strong key)
; Clients must send this in the X-API-Key header
api_key = change-me-on-first-run

; Log file path
log_file = /var/log/vod-server/vod-server.log

; Log level: debug, info, warn, error
log_level = info

; PID file
pid_file = /var/run/vod-server.pid

; Web GUI static files directory
www_root = /usr/local/share/vod-server/www

[ssl]
; Enable HTTPS
enabled = false

; Path to SSL certificate and key files
cert_file = /etc/vod-server/ssl/cert.pem
key_file = /etc/vod-server/ssl/key.pem

; Auto-generate a self-signed certificate if none exists
auto_self_signed = true

[storage]
; Path to the VOD content library (any mounted disk)
; All transcoded output goes here, organized by content ID
library_path = /var/lib/vod-server/library

; Temporary directory for transcoding workspace
; Should be on a fast disk (SSD preferred)
temp_path = /var/lib/vod-server/tmp

; Minimum free disk space (GB) before refusing new jobs
min_free_space_gb = 10

; Database file path
database_path = /var/lib/vod-server/vod-server.db

[transcoding]
; Maximum number of concurrent transcode jobs
; Set based on CPU cores: recommended = cores / 2
max_concurrent_jobs = 2

; Path to FFmpeg binary
ffmpeg_path = /usr/bin/ffmpeg

; Path to FFprobe binary
ffprobe_path = /usr/bin/ffprobe

; Path to MP4Box (GPAC) binary for CMAF packaging
mp4box_path = /usr/bin/MP4Box

; Default transcode profile (standard, high, low, hevc, av1)
default_profile = standard

; HLS/DASH segment duration in seconds
segment_duration = 6

; GOP size (keyframe interval in frames)
; For 24fps: 48 = 2 seconds, for 30fps: 60 = 2 seconds
gop_size = 48

; Job processor polling interval in seconds
poll_interval = 10

; Hardware acceleration: none, nvenc, vaapi, qsv
hwaccel = none

; GPU device index (for multi-GPU systems)
gpu_device = 0

[profile:standard]
; H.264 ABR ladder — maximum device compatibility
codec = libx264
preset = slow
crf = 23
renditions = 360p:400k,480p:1000k,720p:2800k,1080p:5000k
audio_codec = aac
audio_bitrate = 128k

[profile:high]
; HEVC ABR ladder — 30% bitrate savings for modern devices
codec = libx265
preset = slow
crf = 22
renditions = 480p:500k,720p:1500k,1080p:3000k
audio_codec = aac
audio_bitrate = 128k

[profile:low]
; H.264 low bandwidth — for constrained connections
codec = libx264
preset = medium
crf = 26
renditions = 360p:300k,480p:700k,720p:1500k
audio_codec = aac
audio_bitrate = 96k

[profile:hevc_4k]
; HEVC with 4K — for premium content
codec = libx265
preset = slow
crf = 20
renditions = 480p:500k,720p:1500k,1080p:3000k,2160p:10000k
audio_codec = aac
audio_bitrate = 192k

[profile:av1]
; AV1 — royalty-free, web/mobile only
codec = libsvtav1
preset = 6
crf = 28
renditions = 480p:400k,720p:1200k,1080p:2500k
audio_codec = aac
audio_bitrate = 128k

[thumbnails]
; Generate thumbnail sprite sheets for seek preview
enabled = true

; Seconds between thumbnail captures
interval = 10

; Thumbnail dimensions
width = 160
height = 90

; Grid columns in sprite sheet
columns = 10

; JPEG quality (1-100)
quality = 75

[cluster]
; Display name for this node
node_name = vod-node-1

; How often to ping peer servers (seconds)
health_check_interval = 30

; Mark peer as offline after N missed health checks
offline_threshold = 3

; Maximum concurrent migrations
max_concurrent_migrations = 1
